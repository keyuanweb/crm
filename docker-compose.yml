# CRM 一键部署配置
# 启动命令: docker-compose up -d
# 停止命令: docker-compose down
# 查看日志: docker-compose logs -f

services:
  # ==================== 后端服务 ====================
  crm-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crm-backend
    ports:
      - "8081:8081"
    environment:
      # 数据库配置
      - SPRING_PROFILES_ACTIVE=prod
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=crm_db
      - DB_USER=crm_user
      - DB_PASSWORD=${DB_PASSWORD:-crm123456}
      # Redis 配置
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      # JWT 密钥（生产环境必须修改）
      - JWT_SECRET=${JWT_SECRET}
      # 定时任务配置
      - CRM_SCHEDULER_EXPORT_CRON=0 0/5 * * * ?
      - CRM_SCHEDULER_RETENTION_CRON=0 0 2 * * ?
      # CORS 配置
      - CORS_ALLOWED_ORIGINS=http://localhost:5173
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - crm-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s

  # ==================== 前端服务 ====================
  crm-frontend:
    image: nginx:alpine
    container_name: crm-frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - crm-backend
    restart: unless-stopped
    networks:
      - crm-network

  # ==================== 数据库 ====================
  mysql:
    image: mysql:8.0
    container_name: crm-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-root123456}
      - MYSQL_DATABASE=crm_db
      - MYSQL_USER=crm_user
      - MYSQL_PASSWORD=${DB_PASSWORD:-crm123456}
      - TZ=Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./backend/src/main/resources/db/migration:/docker-entrypoint-initdb.d:ro
    command: >
      --default-authentication-plugin=caching_sha2_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max-connections=500
      --innodb-buffer-pool-size=256M
    restart: unless-stopped
    networks:
      - crm-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "crm_user", "-p${DB_PASSWORD:-crm123456}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ==================== 缓存 ====================
  redis:
    image: redis:7-alpine
    container_name: crm-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - crm-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

# ==================== 数据卷 ====================
volumes:
  mysql-data:
    driver: local
  redis-data:
    driver: local

# ==================== 网络 ====================
networks:
  crm-network:
    driver: bridge
