# CRM 一键部署配置
# 启动命令: docker-compose up -d
# 停止命令: docker-compose down
# 查看日志: docker-compose logs -f

services:
  # ==================== 后端服务 ====================
  crm-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crm-backend
    ports:
      - "8081:8081"
    environment:
      # 数据库配置
      - SPRING_PROFILES_ACTIVE=prod
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=crm_db
      - DB_USER=crm_user
      - DB_PASSWORD=${DB_PASSWORD:-crm123456}
      # Redis 配置
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      # JWT 密钥（生产环境必须修改）
      - JWT_SECRET=${JWT_SECRET}
      # 定时任务配置
      - CRM_SCHEDULER_EXPORT_CRON=0 0/5 * * * ?
      - CRM_SCHEDULER_RETENTION_CRON=0 0 2 * * ?
      # 邮件通道（030）：不设置 CRM_MAIL_HOST 则邮件未启用，发送记录标记 SKIPPED 并提示未发送
      - CRM_MAIL_HOST=${CRM_MAIL_HOST:-}
      - CRM_MAIL_PORT=${CRM_MAIL_PORT:-587}
      - CRM_MAIL_USERNAME=${CRM_MAIL_USERNAME:-}
      - CRM_MAIL_PASSWORD=${CRM_MAIL_PASSWORD:-}
      - CRM_MAIL_FROM=${CRM_MAIL_FROM:-crm@example.com}
      # 收信侧（101）：未接入真实 IMAP。不设置/置 false 则同步端点回 409 且不写任何记录；
      # 置 true 才允许生成一条状态为 SIMULATED 的演示记录（界面标"模拟"）。
      - CRM_MAIL_INBOUND_DEMO_ENABLED=${CRM_MAIL_INBOUND_DEMO_ENABLED:-false}
      # 出站地址白名单（SSRF 防护，FR-G13）：**留空 = 不放行任何出站目标，公网也不放行**，
      # 即 Webhook 回调与集成渠道在编排下默认全部不可用。需要回调外部服务时在 .env 中填写，
      # 例：CRM_OUTBOUND_ALLOWED_HOSTS=hooks.example.com,10.0.0.8
      # 改造前本编排未透出该变量，而 compose 只传 environment 列表内的变量 —— 于是
      # 属性虽然存在、默认值也安全，却在编排下**根本无法配置**：合法集成无路可走，
      # 要开只能改镜像内的 application.yml。属功能缺口，不只是可发现性问题。
      - CRM_OUTBOUND_ALLOWED_HOSTS=${CRM_OUTBOUND_ALLOWED_HOSTS:-}
      # CORS 配置：编排下前端由 nginx 在 80 端口提供，浏览器 Origin 是 http://localhost。
      # 改造前这里是开发服务器端口 5173 —— 该端口在编排下没有任何服务监听，
      # 于是同源的页面请求被后端以跨域来源拒绝（同源策略下浏览器仍会带上 Origin）。
      - CORS_ALLOWED_ORIGINS=http://localhost
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - crm-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s

  # ==================== 前端服务 ====================
  crm-frontend:
    # 构建期产出静态产物（见 frontend/Dockerfile）。改造前是 `image: nginx:alpine` + 挂载宿主机
    # `./frontend/dist` —— 该目录不随仓库交付、也不被编排构建，干净检出启动只会得到空白页。
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: crm-frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # 只挂配置。产物在镜像里，不再从宿主机挂入 —— 挂载点一旦留在编排里，
      # 就会诱使后人把 `dist` 当成交付物（正是本次要修掉的误解）。
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - crm-backend
    restart: unless-stopped
    networks:
      - crm-network

  # ==================== 数据库 ====================
  mysql:
    image: mysql:8.0
    container_name: crm-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-root123456}
      - MYSQL_DATABASE=crm_db
      - MYSQL_USER=crm_user
      - MYSQL_PASSWORD=${DB_PASSWORD:-crm123456}
      - TZ=Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # 刻意**不**把 db/migration 挂成 /docker-entrypoint-initdb.d：MySQL 按文件名字母序执行该目录
      # （V1, V10, V11, …, V2, V20 …），与 Flyway 的版本序（数值序）不一致，两套机制会互相打架：
      # 表被以错误顺序建出来、而 Flyway 的 history 表并不存在，随后后端的 Flyway 会从 V1 重放并失败。
      # 正确的分工是：MySQL 只建空库（MYSQL_DATABASE 已做），库结构全部交给后端启动时的 Flyway。
    command: >
      --default-authentication-plugin=caching_sha2_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max-connections=500
      --innodb-buffer-pool-size=256M
    restart: unless-stopped
    networks:
      - crm-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "crm_user", "-p${DB_PASSWORD:-crm123456}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ==================== 缓存 ====================
  redis:
    image: redis:7-alpine
    container_name: crm-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - crm-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

# ==================== 数据卷 ====================
volumes:
  mysql-data:
    driver: local
  redis-data:
    driver: local

# ==================== 网络 ====================
networks:
  crm-network:
    driver: bridge
