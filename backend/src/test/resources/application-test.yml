spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisReactiveAutoConfiguration
  datasource:
    # NON_KEYWORDS=YEAR,USER（T074）：两个词在 H2 2.x 里是关键字，但在本项目里被当作标识符用，而生产端 MySQL 允许。
    #
    # YEAR：schema-h2.sql 里 `year` 是**列名**（sales_quota.year，镜像自 V71），MyBatis-Plus 生成的
    #   `INSERT INTO sales_quota (year, ...)` 因此直接语法错误——销售配额模块的**任何写路径在测试库上都跑不通**，
    #   而这段 SQL 此前没有任何用例执行过（SalesQuotaIT 是第一个）。
    # USER：`SalesQuotaRepository.getTeamRanking` 的 `(SELECT id FROM user WHERE department_id = sq.team_id)`
    #   未加引号，H2 报 `expected "identifier"`。全仓仅此一处裸写 user（表本身在镜像里写作 `user`）。
    #
    # 两处非关键字化都只影响"把该词当标识符解析"：`YEAR(closed_at)` / `USER()` 这类函数调用不受影响
    # （前者的行为由 SalesQuotaIT 的年度汇总断言钉住；后者全仓无调用）。
    url: jdbc:h2:mem:crm;MODE=MySQL;NON_KEYWORDS=YEAR,USER;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ''
  flyway:
    enabled: false
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-h2.sql
  data:
    redis:
      host: localhost
      port: 6379

jwt:
  secret: test-secret-key-for-integration-tests-0123456789abcdef
  access-token-ttl-seconds: 1800
  refresh-token-ttl-seconds: 604800

# 测试环境默认关闭验证码，避免影响大量依赖 loginAndGetToken 的既有集成测试；
# AuthCaptchaIT 通过 @TestPropertySource 单独启用验证码
crm:
  captcha:
    enabled: false
  security:
    mfa:
      # 082：测试用固定密钥 —— Base64 的 32 字节 ASCII "test-mfa-key-for-082-0123456789x"。
      #
      # 刻意写死字面量而**不**回落到 ${MFA_SECRET_KEY}：开发机上若恰好导出了那个变量，
      # 测试就会用上另一把密钥，表现为"本机绿、CI 红"（或反过来）——而这条失败信息会
      # 指向"密钥不符"，看起来像 AesGcmCipher 出了问题，排查要从测试基建查起。
      secret-key: dGVzdC1tZmEta2V5LWZvci0wODItMDEyMzQ1Njc4OXg=
      # 与默认值刻意不同：这样凡是把 issuer 写死成 "CRM"（而不是读配置）的代码，
      # 都会在断言 otpauth URI 时暴露出来。
      issuer: CRM-Test
      # 其余项（token-ttl / time-step / tolerance / max-attempts / lock-duration /
      # recovery-code-count）刻意沿用主 yml 的默认值，不在此重复：重复声明会让
      # "生产默认值改了、测试没跟上"这种漂移有一个藏身处。需要缩短窗口的用例走
      # FixedClockTestSupport 推进时钟，而不是改成更小的配置值。

logging:
  level:
    com.crm: INFO
