spring:
  application:
    name: crm-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:crm_db}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER:crm_user}
    password: ${DB_PASSWORD:crm123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jackson:
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

server:
  port: ${SERVER_PORT:8081}

# 合同附件存储目录（008，本地磁盘）
crm:
  contract:
    storage-dir: ${CONTRACT_STORAGE_DIR:./contract-files}
  pool:
    stale-days: ${POOL_STALE_DAYS:30}
  captcha:
    # 048：验证码默认关闭（开发/演示直接登录）；生产可通过环境变量 CAPTCHA_ENABLED=true 强制开启
    enabled: ${CAPTCHA_ENABLED:false}

# CORS：允许的前端 Origin（逗号分隔），生产环境通过环境变量覆盖
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# JWT secrets MUST be overridden via environment in non-dev environments
jwt:
  secret: ${JWT_SECRET:crm-dev-secret-key-please-override-in-prod-0123456789abcdef}
  access-token-ttl-seconds: ${JWT_ACCESS_TTL:1800}
  refresh-token-ttl-seconds: ${JWT_REFRESH_TTL:604800}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# Actuator：健康检查（匿名可读）+ 应用信息；metrics 等仅内部
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

logging:
  level:
    com.crm: INFO
