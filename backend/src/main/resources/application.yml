spring:
  application:
    name: crm-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:crm_db}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER:crm_user}
    password: ${DB_PASSWORD:crm123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jackson:
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  # 默认调度器是单线程，所有 @Scheduled 串行——一个作业跑得久会拖住其余作业。
  # 1.3 起有 3 个作业（定时导出、数据保留归档、SLA 升级），显式放开为 3 个线程。
  task:
    scheduling:
      pool:
        size: ${SCHEDULING_POOL_SIZE:3}

server:
  port: ${SERVER_PORT:8081}

# 合同附件存储目录（008，本地磁盘）
crm:
  contract:
    storage-dir: ${CONTRACT_STORAGE_DIR:./contract-files}
  pool:
    stale-days: ${POOL_STALE_DAYS:30}
  captcha:
    # 048：验证码默认关闭（开发/演示直接登录）；生产可通过环境变量 CAPTCHA_ENABLED=true 强制开启
    enabled: ${CAPTCHA_ENABLED:false}
  mail:
    # 030 邮件营销：SMTP 配置。host 留空 = 邮件通道未启用，此时所有发送记录标记 SKIPPED
    # （而非 SENT），前端提示"邮件未真实发送"——不会再把未发出的邮件统计成已发送。
    # 需要真实发信时注入 CRM_MAIL_HOST / CRM_MAIL_USERNAME / CRM_MAIL_PASSWORD。
    host: ${CRM_MAIL_HOST:}
    port: ${CRM_MAIL_PORT:587}
    username: ${CRM_MAIL_USERNAME:}
    password: ${CRM_MAIL_PASSWORD:}
    from: ${CRM_MAIL_FROM:crm@example.com}
  scheduler:
    # 定时导出扫描间隔（cron 表达式），默认每 5 分钟
    export-cron: ${CRM_SCHEDULER_EXPORT_CRON:0 0/5 * * * ?}
    # 数据保留归档扫描间隔（cron 表达式），默认每天凌晨 2 点
    retention-cron: ${CRM_SCHEDULER_RETENTION_CRON:0 0 2 * * ?}
    # SLA 升级扫描间隔（cron 表达式），默认每 10 分钟（1.3-sla-escalation）
    sla-cron: ${CRM_SCHEDULER_SLA_CRON:0 */10 * * * ?}
  sla:
    # 即将超时阈值（小时）：剩余 ≤ 该值 → WARNING。默认 2，与改造前的硬编码一致（1.3）
    warning-min-hours: ${CRM_SLA_WARNING_MIN_HOURS:2}
  outbound:
    # 出站地址白名单（逗号分隔的主机名或字面地址），SSRF 防护的显式出口（FR-G13/055）。
    # ⚠️ 留空 = 不放行任何出站目标，**公网地址同样不放行**：Webhook 回调与集成渠道在默认
    # 配置下全部被拒，且拒绝理由会区分"目标是内网地址"与"不在白名单内"。
    # 因此需要回调外部服务的部署必须显式列出目标主机，例如：
    #   CRM_OUTBOUND_ALLOWED_HOSTS=hooks.example.com,10.0.0.8
    # 本项此前只作为代码里的 @Value 默认值存在，任何可部署配置文件中都没有声明——
    # 运维无从得知准确拼写，等价于这项白名单在实践中不可用（见 data-model.md §4）。
    # 判定顺序（白名单优先于网段判定）与残余风险边界见 com.crm.common.OutboundUrlValidator。
    allowed-hosts: ${CRM_OUTBOUND_ALLOWED_HOSTS:}

# CORS：允许的前端 Origin（逗号分隔），生产环境通过环境变量覆盖
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175}

# JWT secrets MUST be overridden via environment in non-dev environments
jwt:
  secret: ${JWT_SECRET:crm-dev-secret-key-please-override-in-prod-0123456789abcdef}
  access-token-ttl-seconds: ${JWT_ACCESS_TTL:1800}
  refresh-token-ttl-seconds: ${JWT_REFRESH_TTL:604800}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# Actuator：健康检查（匿名可读）+ 应用信息；metrics 等仅内部
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

logging:
  level:
    com.crm: INFO
