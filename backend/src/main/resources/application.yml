spring:
  application:
    name: crm-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:crm_db}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER:crm_user}
    password: ${DB_PASSWORD:crm123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jackson:
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  # 默认调度器是单线程，所有 @Scheduled 串行——一个作业跑得久会拖住其余作业。
  # 1.3 起有 3 个作业（定时导出、数据保留归档、SLA 升级），显式放开为 3 个线程。
  task:
    scheduling:
      pool:
        size: ${SCHEDULING_POOL_SIZE:3}

server:
  port: ${SERVER_PORT:8081}

# 合同附件存储目录（008，本地磁盘）
crm:
  contract:
    storage-dir: ${CONTRACT_STORAGE_DIR:./contract-files}
  pool:
    stale-days: ${POOL_STALE_DAYS:30}
  captcha:
    # 048：验证码默认关闭（开发/演示直接登录）；生产可通过环境变量 CAPTCHA_ENABLED=true 强制开启
    enabled: ${CAPTCHA_ENABLED:false}
  mail:
    # 030 邮件营销：SMTP 配置。host 留空 = 邮件通道未启用，此时所有发送记录标记 SKIPPED
    # （而非 SENT），前端提示"邮件未真实发送"——不会再把未发出的邮件统计成已发送。
    # 需要真实发信时注入 CRM_MAIL_HOST / CRM_MAIL_USERNAME / CRM_MAIL_PASSWORD。
    host: ${CRM_MAIL_HOST:}
    port: ${CRM_MAIL_PORT:587}
    username: ${CRM_MAIL_USERNAME:}
    password: ${CRM_MAIL_PASSWORD:}
    from: ${CRM_MAIL_FROM:crm@example.com}
    inbound:
      # 101 收信侧诚实化：本项没有接入真实 IMAP。默认 false = POST /mail-accounts/{id}/sync
      # 明确回 409（MAIL_INBOUND_NOT_CONFIGURED）且不写任何记录；置 true 才允许生成一条状态为
      # SIMULATED 的演示记录（界面上标"模拟"，不会显示成"已同步"）。
      # ⚠️ 唯一真源是本行的 false；Java 侧 MailInboundStatus 的 @Value 默认值只是"配置缺失时的兜底"，
      # 两处必须同向（本仓有过"代码默认 true、yml false ⇒ yml 胜出 ⇒ 代码默认值是死代码却会被读成真源"的先例）。
      # ⚠️ 本键只表示"允许生成演示记录"，不是连通性探测：置 true 而 IMAP 不存在时端点照样 200。
      demo-enabled: ${CRM_MAIL_INBOUND_DEMO_ENABLED:false}
  scheduler:
    # 定时导出扫描间隔（cron 表达式），默认每 5 分钟
    export-cron: ${CRM_SCHEDULER_EXPORT_CRON:0 0/5 * * * ?}
    # 数据保留归档扫描间隔（cron 表达式），默认每天凌晨 2 点
    retention-cron: ${CRM_SCHEDULER_RETENTION_CRON:0 0 2 * * ?}
    # SLA 升级扫描间隔（cron 表达式），默认每 10 分钟（1.3-sla-escalation）
    sla-cron: ${CRM_SCHEDULER_SLA_CRON:0 */10 * * * ?}
    # Webhook 投递记录清扫间隔（cron 表达式），默认每 5 分钟（085-verify-green，FR-V07）
    webhook-sweep-cron: ${CRM_SCHEDULER_WEBHOOK_SWEEP_CRON:0 */5 * * * ?}
  sla:
    # 即将超时阈值（小时）：剩余 ≤ 该值 → WARNING。默认 2，与改造前的硬编码一致（1.3）
    warning-min-hours: ${CRM_SLA_WARNING_MIN_HOURS:2}
  outbound:
    # 出站地址白名单（逗号分隔的主机名或字面地址），SSRF 防护的显式出口（FR-G13/055）。
    # ⚠️ 留空 = 不放行任何出站目标，**公网地址同样不放行**：Webhook 回调与集成渠道在默认
    # 配置下全部被拒，且拒绝理由会区分"目标是内网地址"与"不在白名单内"。
    # 因此需要回调外部服务的部署必须显式列出目标主机，例如：
    #   CRM_OUTBOUND_ALLOWED_HOSTS=hooks.example.com,10.0.0.8
    # 本项此前只作为代码里的 @Value 默认值存在，任何可部署配置文件中都没有声明——
    # 运维无从得知准确拼写，等价于这项白名单在实践中不可用（见 data-model.md §4）。
    # 判定顺序（白名单优先于网段判定）与残余风险边界见 com.crm.common.OutboundUrlValidator。
    allowed-hosts: ${CRM_OUTBOUND_ALLOWED_HOSTS:}
  rate-limit:
    # 全局限流（100-rate-limit-consolidation）。**逐端点的配额数字不在这里**——它们写在端点方法上的
    # @RateLimit(scope, limit, windowSeconds)（与端点同址，照 @RequirePermission 的体例），
    # 理由是配额是逐端点的量（导出 10/60s 与表单 3/60s 差 20 倍），集中成一张表会让「这个端点该配多少」
    # 与「这个端点干什么」分居两地。本段只有两个全局开关。
    #
    # ⚠️ 默认值只留一处真源：@Value 里的默认值与本文件必须一致。仓里有「代码默认 true、yml 里 false、
    # yml 胜出」的前例（见 captcha），那种情况下运维从代码里读不到生效值——故这两个键在这里显式声明。
    #
    # enabled=false 时切面**跳过一切计数**（含 Redis 调用），用于压测/排障，不是长期配置钮。
    enabled: ${CRM_RATE_LIMIT_ENABLED:true}
    # X-Forwarded-For 首值是否可信。默认 true = 与改造前三处 clientIp 副本的行为逐字相同
    # （它们无条件读 XFF），从而保住现有部署的可观测行为。
    #
    # ⚠️ 该默认值只在「反向代理是唯一入口、且代理自己重写 XFF」时成立（生产上 nginx 是唯一入口）。
    # **直连后端端口时可以伪造首值** ⇒ 此时「按 IP 分桶」形同虚设。这是**已知并登记为债务**的洞
    # （修复动作：可信代理网段白名单 + 从右往左取 XFF），本批不做；server.forward-headers-strategy
    # 不解决它（同样要求可信边界配置）。
    # ⇒ 因此公开端点上的 IP 限流的定位是**误用与意外的阻尼**（防一个死循环的前端把工单表灌满、
    # 防一个预取器把落地页打成 DB 热点），**不是抗敌手措施**——不得在任何文档里把它宣传成攻击防护。
    # 「直连在公网、前面没有可信代理」的部署应设为 false：此时完全不看 XFF，只按 remoteAddr 分桶。
    trust-forwarded-for: ${CRM_RATE_LIMIT_TRUST_FORWARDED_FOR:true}
  security:
    # 082-two-factor-auth：TOTP 双因素认证。
    mfa:
      # TOTP 密钥的静态加密密钥（AES-256-GCM，见 com.crm.common.AesGcmCipher）。
      # 必须是 Base64 编码的**恰好 32 字节**：openssl rand -base64 32
      #
      # ⚠️ 留空 = 未配置，这是**合法状态**（2FA 是可选功能，很多部署不用它）：
      # 启动只告警，绑定/启用等用到密钥的路径在**调用时**以 MFA_SECRET_MISSING 失败
      # ——fail closed，绝不会静默降级成单因素。
      # 配了但解出来不是 32 字节 = 误配，**启动即抛**（见 SecurityDefaultsGuard）。
      # 两种错法分开处置的理由写在 SecurityDefaultsGuard.checkMfaSecretKey 上。
      secret-key: ${MFA_SECRET_KEY:}
      # 二次验证票据（mfaToken）的有效期，秒。只覆盖"密码已通过、验证码尚未提交"
      # 这一段，与 jwt 的 access/refresh TTL 无关。
      token-ttl-seconds: ${MFA_TOKEN_TTL:300}
      # TOTP 时间步长（秒）与容错步数。±1 步 = 前后各 30 秒，是认证器 App 与服务器
      # 时钟漂移的通行容忍度；取 0 会让时钟差一秒的用户直接登不进来。
      time-step-seconds: ${MFA_TIME_STEP:30}
      time-step-tolerance: ${MFA_TIME_STEP_TOLERANCE:1}
      # 连续失败达到 max-attempts 即锁定 lock-duration-seconds。
      # ⚠️ 窗口从**达到阈值的那一次失败**起算，不是从第 1 次失败起算——
      # 后者会把"5 次"变成"5 分钟内总共 5 次"，与规格 SC-M04 的措辞不符。
      max-attempts: ${MFA_MAX_ATTEMPTS:5}
      lock-duration-seconds: ${MFA_LOCK_DURATION:900}
      # 启用 / 重新生成恢复码时下发的条数。
      recovery-code-count: ${MFA_RECOVERY_CODE_COUNT:10}
      # otpauth:// URI 里的发行方（认证器 App 中的条目分组名）。改它会让已绑定的
      # 用户在 App 里看到的名字与服务器不一致，但**不影响码的校验**（码只由密钥与
      # 时间步决定）——故它不是安全参数，只是显示名。
      issuer: ${MFA_ISSUER:CRM}

# CORS：允许的前端 Origin（逗号分隔），生产环境通过环境变量覆盖
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175}

# JWT secrets MUST be overridden via environment in non-dev environments
jwt:
  secret: ${JWT_SECRET:crm-dev-secret-key-please-override-in-prod-0123456789abcdef}
  access-token-ttl-seconds: ${JWT_ACCESS_TTL:1800}
  refresh-token-ttl-seconds: ${JWT_REFRESH_TTL:604800}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# Actuator：健康检查（匿名可读）+ 应用信息；metrics 等仅内部
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

logging:
  level:
    com.crm: INFO
