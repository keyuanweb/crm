name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: Backend build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test (mvn test + spotless + jacoco)
        working-directory: backend
        run: mvn -B verify

  frontend:
    name: Frontend build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Node 版本必须满足 pnpm 的 engines 约束：pnpm 11.7.0 要求 node >= 22.13。
      # 原为 '18'，pnpm 无法在其上运行，前端作业整体不可达。
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        working-directory: frontend
        run: pnpm run typecheck
      - name: Lint
        working-directory: frontend
        run: pnpm run lint
      # 语言资源对齐（一期 1.4）。单元测试里 react-i18next 被 mock，缺键不会让任何测试失败，
      # 只会让界面渲染出键名，因此必须单独设一道门禁：两个语言文件键集合不一致即失败。
      - name: i18n key parity
        working-directory: frontend
        run: pnpm run i18n:check
      # 菜单清单陈旧性（084 FR-N23 的前端一半）。侧边栏的分组、顺序与名称已由生成物
      # `src/constants/menuManifest.ts` 派生，生成物进版本库；改了后端权威处
      # （RoleConstants.MENU_TREE）而忘记重生成，生成物就会静默落后——本步骤重新生成并逐字节比对。
      # 与上一步的分工是刻意的：i18n:check 管「路由与清单双向对齐」，本步骤管「生成物与权威处一致」。
      - name: Menu manifest is up to date
        working-directory: frontend
        run: pnpm run menu:check
      # 权限判定接线（086）。挂错一个权限码是**静默失效**：`hasPerm` 走 permissions.includes(code)，
      # 字典里不存在的码不会被授给任何角色，于是按钮无声无息地消失——没有报错、没有 403、控制台无提示。
      # 后端 `FrontendPermissionCodeAlignmentTest` 只管住登记表那半边（码是否合法），
      # 管不到「页面有没有用对键」与「有没有人写回 role === 'ADMIN' 的旧写法」，故必须单独设一道门禁。
      - name: Permission gating is wired correctly
        working-directory: frontend
        run: pnpm run perms:check
      # 界面规范（088）。这些规则守的都是**不会让任何测试变红**的漂移：新写一个品牌色字面量、
      # 裸的中文 placeholder、无引用的孤儿组件——都能编译、都能通过用例，只在界面上显形。
      # 白名单是**债务台账**（双向校验：新增违规会红，条目陈旧也会红），随迁移单调收缩。
      # 此处只跑默认档（R1/R4/R5/R6/R7 与 **R2** 为 error）；**R3** 是正在被逐页还掉的债，
      # 仍躲在 --strict 后面，故**不能**在这里改成 ui:check:strict（那会把 R3 的 89 处一起变红）。
      # ⚠️ R2 于 2026-09-15（088 T040）由 `--strict` 档**逐条毕业**成默认档 error：22 处清零、
      # `strict` 改 `false`、`allowed` 仍 `null` ⇒ 零容忍。它**不再**是"躲在 --strict 后面"的那一半。
      # ⚠️ **上面那两句已作废——原文保留在上、不删**（2026-09-15，088 T045）：R3 于同日**逐条毕业**
      # （89 → 2 → 0，`allowed` 始终为 `null`），于是七条规则**全部**是默认档 ⇒ `--strict` 这个开关
      # **不再改变任何行为**，故连同 `package.json` 的 `ui:check:strict` 一并删除。
      # 上面那句"不能在这里改成 ui:check:strict"今天**两头都不成立**：脚本已无此选项（跑了会报错），
      # 而两档并成一档后也没有"改成更严的那一档"这回事了。
      # 本步骤仍写 `pnpm run ui:check`——它**就是**唯一的档；而 **R3 从今天起第一次进 CI 强制**
      # （它此前那 89 处债从来不在 CI 的视野里）。锚字符串：`run: pnpm run ui:check`。
      - name: UI conventions (ui:check)
        working-directory: frontend
        run: pnpm run ui:check
      # 必须走 test:coverage 而不是 test：覆盖率阈值（vite.config.ts 的 coverage.thresholds，
      # FR-G09）只在该命令下生效。跑 test 的话门禁「配了但不管」——正是本规格要消除的形态。
      - name: Unit tests (with coverage threshold)
        working-directory: frontend
        run: pnpm run test:coverage
      - name: Build
        working-directory: frontend
        run: pnpm run build

  # 端到端门禁（FR-G10）。**不能塞进上面的 frontend 作业**：e2e 用例要求后端 8081 与
  # MySQL/Redis 真实可用（login.spec.ts 直接登录、user-management.spec.ts 会写入数据），
  # 故独立成作业并自带依赖服务。
  #
  # 前置条件：验证码必须关闭。登录页的验证码输入框是必填（UI 层），用例填占位值；
  # 后端仅在 CAPTCHA_ENABLED=true 时才校验该字段（AuthService.login），默认即关闭。
  # 此处显式声明为 false，避免被仓库级环境变量意外打开而使整套用例失败。
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    env:
      CAPTCHA_ENABLED: 'false'
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root123456
          MYSQL_DATABASE: crm_db
          MYSQL_USER: crm_user
          MYSQL_PASSWORD: crm123456
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot123456"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Start backend
        working-directory: backend
        # Flyway 在空库上建表并迁移，DataInitializer 随后创建 admin/admin123
        run: |
          nohup mvn -B -DskipTests spring-boot:run > /tmp/backend.log 2>&1 &
      - name: Wait for backend readiness
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8081/actuator/health >/dev/null; then
              echo "backend ready after $((i * 5))s"
              exit 0
            fi
            sleep 5
          done
          echo "::error::backend not ready after 300s"
          tail -100 /tmp/backend.log
          exit 1
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: E2E tests
        working-directory: frontend
        run: pnpm run test:e2e
      - name: Upload backend log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-backend-log
          path: /tmp/backend.log
